# Dedicated vhost for the isolated recruitment acceptance environment. Install
# it as /etc/nginx/sites-available/recrutement.techzone.lat.conf, then use
# Certbot to obtain and install its own certificate.
server {
    listen 80;
    listen [::]:80;
    server_name recrutement.techzone.lat;

    client_max_body_size 21m;

    location ^~ /media/recrutement/ { deny all; return 404; }
    location ^~ /var/lib/techzone/recruitment/ { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
