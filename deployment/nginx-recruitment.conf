# Insert these more-specific locations in the existing www.techzone.lat server
# block. Keep 3011 synchronized with RECRUITMENT_HOST_PORT from
# deployment/compose.env after confirming it is free on the shared VPS.
location ^~ /api/recrutement/ {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location ^~ /api/admin/recrutement/ {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Defense in depth: RECRUITMENT_STORAGE_DIR (see recruitment.env.template) is
# expected to live outside any web root (e.g. /var/lib/techzone/recruitment),
# so nginx should never be asked to serve it directly. This block ensures
# that if the storage path or a "/media" alias is ever mistakenly placed
# under the web root, a request for it is still rejected instead of served.
location ^~ /media/recrutement/ {
    deny all;
    return 404;
}
location ^~ /var/lib/techzone/recruitment/ {
    deny all;
    return 404;
}
