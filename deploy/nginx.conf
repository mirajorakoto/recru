# nginx : sert l'application web et relaie /api vers le serveur (conteneur « backend »).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Un CV peut peser 10 Mo, plus une lettre de motivation : on laisse de la marge.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Résolution du nom « backend » à chaque requête : nginx démarre même si le serveur n'est pas encore prêt.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3111;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application monopage : toute autre adresse renvoie index.html (le routage se fait dans le navigateur).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
